# =====================================================================
#  EMPRESAS CON OFICINAS EN BARCELONA (y su página de empleo)
#
#  Campos:
#   nombre:      nombre de la empresa
#   alias:       otros nombres con los que aparece en los portales (opcional)
#   sector:      Moda | Belleza | [Moda, Belleza] (si tiene de los dos, se decide
#                por las palabras de cada oferta; el primero es el de por defecto)
#   tipo:        solo informativo
#   plataforma:  cómo se leen sus ofertas:
#                  greenhouse | greenhouse_eu | lever | lever_eu | workable |
#                  personio | teamtailor | smartrecruiters | recruitee | ashby |
#                  successfactors | workday | factorial | html | pendiente | ninguna
#                "pendiente" = todavía no se ha confirmado su página de empleo:
#                la app no la consulta (sus ofertas llegan por LinkedIn,
#                Indeed o InfoJobs) y aparece en el resumen de la web.
#                "ninguna" = no tiene página de empleo propia.
#   id:          identificador en la plataforma (p. ej. jobs.lever.co/ID)
#   url:         página de empleo (para successfactors, teamtailor, factorial,
#                workday y html)
#   enlace_patron: (solo html) texto que deben contener los enlaces a ofertas
#   ubicacion:   ubicación por defecto si la oferta no la indica
#   estado:      verificada | por_verificar | pendiente
#   notas:       lo que quieras
#
#  Para AÑADIR una empresa, copia un bloque y cámbialo. Si no sabes su
#  plataforma, pon "plataforma: pendiente" y "web:" con su dirección.
#  Cómo averiguar la plataforma: abre una oferta suya y mira la dirección:
#    boards.greenhouse.io/XXX o job-boards.greenhouse.io/XXX → greenhouse, id: XXX
#    job-boards.eu.greenhouse.io/XXX                         → greenhouse_eu, id: XXX
#    jobs.lever.co/XXX                                       → lever, id: XXX
#    apply.workable.com/XXX                                  → workable, id: XXX
#    XXX.jobs.personio.de  /  XXX.jobs.personio.com          → personio, id: XXX
#    XXX.teamtailor.com o una web con /jobs/12345-titulo     → teamtailor, url: (inicio de la web de empleo)
#    jobs.smartrecruiters.com/XXX                            → smartrecruiters, id: XXX
#    XXX.recruitee.com                                       → recruitee, id: XXX
#    jobs.ashbyhq.com/XXX                                    → ashby, id: XXX
#    XXX.factorial.es / XXX.factorialhr.com /job_posting/... → factorial, url: https://XXX.factorial.es
#    una web con /job/Ciudad-Titulo/123456/ (SAP)            → successfactors, url: (inicio de la web)
#    XXX.wd3.myworkdayjobs.com/SITIO                         → workday, url: (esa dirección)
#  (AQUÍ PUEDES AÑADIR MÁS EMPRESAS QUE TE INTERESEN, al final de la lista)
# =====================================================================

