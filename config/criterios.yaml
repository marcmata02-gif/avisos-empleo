# ---------------------------------------------------------------------
# GRADUATE PROGRAMS: se destacan y tienen prioridad. Un graduate program
# se mantiene aunque sea un contrato temporal (p. ej. 1 año) o aunque el
# título diga "Head of ... Graduate", siempre que NO sea beca ni prácticas.
# ---------------------------------------------------------------------
