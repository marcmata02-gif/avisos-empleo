# ---------------------------------------------------------------------
# VERSIONES DE CV. "reglas": se aplica la PRIMERA que coincida.
# Condiciones posibles (todas opcionales; si pones varias, deben cumplirse
# todas):
#   area: [lista de áreas]      sector: Moda | Belleza
#   idioma: es | en              graduate: true | false
#   titulo: [palabras en el título]
# ---------------------------------------------------------------------
cv:
  versiones:
    1: "Digital Content Graduate (EN)"
    2: "Marketing Digital – Marca y Contenido (EN)"
    3: "Marketing Digital – Marca y Contenido (ES)"
    4: "Trade Marketing (ES)"
    5: "Iberia Trade Graduate / Marketing de Marca (ES)"
    6: "CV general (EN)"
  reglas:
    - si: {graduate: true, sector: Belleza, idioma: es}
      cv: 5
    - si: {graduate: true, area: [Trade Marketing], idioma: es}
      cv: 5
    - si: {area: [Trade Marketing], idioma: es}
      cv: 4
    - si: {area: [Trade Marketing], idioma: en}
      cv: 4
      nota: "Oferta en inglés: tu CV de Trade Marketing está en español. Alternativa: el 2."
    - si: {graduate: true, sector: Belleza, idioma: en}
      cv: 2
      nota: "Alternativa: el 5 si el puesto es de brand marketing en Iberia."
    - si: {graduate: true, idioma: es}
      cv: 5
    - si: {graduate: true, area: [Comunicación/Contenido, E-commerce], idioma: en}
      cv: 1
    - si: {graduate: true, idioma: en}
      cv: 2
    - si: {area: [Comunicación/Contenido], titulo: [content, contenido, social, redes, tiktok, copy, storytelling, creator, community], idioma: en}
      cv: 1
    - si: {area: [Comunicación/Contenido], titulo: [content, contenido, social, redes, tiktok, copy, storytelling, creator, community], idioma: es}
      cv: 3
    - si: {area: [E-commerce], idioma: en}
      cv: 1
    - si: {area: [E-commerce], idioma: es}
      cv: 3
    - si: {area: [Marketing], sector: Belleza, idioma: es, titulo: [brand, marca, marketing]}
      cv: 5
    - si: {area: [Marketing], idioma: en}
      cv: 2
    - si: {area: [Marketing], idioma: es}
      cv: 3
    - si: {area: [PR]}
      cv: 6
    - si: {area: [Comunicación/Contenido], idioma: es}
      cv: 3
    - si: {area: [Compras]}
      cv: 6
  por_defecto: 6

# ---------------------------------------------------------------------
# AVISOS POR TELEGRAM
# ---------------------------------------------------------------------
telegram:
  # Solo se avisa de ofertas publicadas en los últimos N días
  max_dias_antiguedad: 7
  # Ofertas con estos avisos NO se envían por Telegram (solo aparecen en
  # la web). Valores posibles: experiencia, jornada, idioma.
  # Elegiste "Ninguna, solo en la web" → no se envían las que tengan avisos.
  no_enviar_si_aviso: [experiencia, jornada, idioma]
  # Máximo de mensajes por revisión (el resto se envía en la siguiente)
  max_por_revision: 25
