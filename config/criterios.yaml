# =====================================================================
#  CRITERIOS DE BÚSQUEDA
#  Puedes editar este archivo directamente en GitHub (botón del lápiz).
#  Los cambios se aplican en la siguiente revisión (máx. 30 min) y las
#  ofertas de los últimos 30 días se vuelven a evaluar automáticamente.
#
#  Cómo se escriben las palabras clave:
#   - Da igual mayúsculas/minúsculas y acentos ("comunicación" = "comunicacion").
#   - Se buscan como palabras completas: "intern" NO coincide con "international".
#   - Un asterisco al final busca el principio de palabra: "becari*" encuentra
#     "becario", "becaria", "becarios"...
#   - Puedes poner frases: "trade marketing", "jornada parcial".
# =====================================================================

# ---------------------------------------------------------------------
